<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memoriza vocabulario · OpoRadarCádiz</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{color-scheme:dark;--night:#08182d;--deep:#061222;--gold:#f6cb78;--ink:#f3f3f0;--muted:#b4c1d0;--line:#f1d29b29}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;padding:clamp(12px,3vw,24px);min-height:100vh;background:var(--night);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
main{max-width:620px;margin:2vh auto;background:#102039;border:1px solid var(--line);border-radius:20px;padding:clamp(19px,4vw,30px)}
small{color:var(--gold);font-weight:750}h1{font:500 clamp(28px,5vw,37px)/1.16 'Playfair Display',Georgia,serif}p{color:var(--muted)}
button{font:inherit;font-weight:700;border:1px solid #f6cb7866;border-radius:12px;padding:12px;cursor:pointer;background:var(--gold);color:var(--deep);min-height:48px}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
button:disabled{opacity:.5;cursor:default}
a{color:var(--gold)}.return{display:inline-block;margin:0 0 18px;font-size:14px;font-weight:700;text-decoration:none}
.row{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.row>*{flex:1 1 115px}
.card{display:grid;perspective:1000px;width:100%;background:transparent;padding:0;color:var(--ink);text-align:center;min-height:290px;border:none}
.face{grid-area:1/1;border:1px solid #f6cb7866;border-radius:18px;background:var(--deep);padding:26px;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;transition:transform .35s}
.front{transform:rotateY(0)}.back{transform:rotateY(-180deg);font-size:17px;font-weight:400;white-space:pre-line}
.flipped .front{transform:rotateY(180deg)}.flipped .back{transform:rotateY(0)}
.word{font-size:clamp(22px,4vw,28px)}.hint{font-size:14px;font-weight:400;margin-top:15px;color:var(--muted)}
.good,.bad,.doubt{background:#183653;color:var(--ink)}.doubt{border-color:var(--gold);color:var(--gold)}.secondary{background:transparent;color:var(--gold)}
progress{width:100%;accent-color:var(--gold);margin:16px 0}
#status{font-size:14px;color:var(--muted)}#ratingFeedback{color:var(--gold);font-size:14px}#next{width:100%;margin-top:12px}
footer{font-size:13px;color:var(--muted);margin-top:24px}
@media(prefers-reduced-motion:reduce){.face{transition:none}}
@media(max-width:400px){main{padding:18px}.row>*{flex-basis:100px}.face{padding:18px}}
</style>
<main><a id="backToMenu" class="return" href="../../centro-radar/tema-1/">← Centro Radar</a><small>OPORADARCÁDIZ · NIVEL 1</small><h1>Memoriza vocabulario</h1><p>Piensa qué significa la palabra. Dale la vuelta y decide si has acertado.</p>
<section id="play"><div id="status" aria-live="polite"></div><progress id="progress" max="13" value="0" aria-label="Tarjetas completadas"></progress>
<button id="card" class="card" aria-label="Dar la vuelta a la tarjeta"><span class="face front"><span class="word" id="word"></span><span class="hint">Pulsa para ver la respuesta</span></span><span class="face back" id="answer" aria-hidden="true"></span></button>
<div class="row"><button id="fail" class="bad" disabled>Fallé</button><button id="doubt" class="doubt" disabled>Dudé</button><button id="pass" class="good" disabled>Acerté</button></div><p id="ratingFeedback" role="status" hidden></p><button id="next" class="secondary" hidden>Siguiente tarjeta →</button></section>
<section id="result" hidden aria-live="polite"><h2>Ronda terminada</h2><p id="score"></p><div class="row"><button id="retry">Repasar mis fallos</button><button id="all" class="secondary">Todas otra vez</button></div></section>
<footer>El repaso de tus fallos se guarda solo en este navegador, si permite almacenamiento. No se envían datos. <button id="saved" class="secondary" style="margin-top:12px;font-size:14px">Repasar fallos guardados</button><p id="notice" role="status"></p></footer></main>
<script>
'use strict';
const cards = [
['Constitución','Es la ley fundamental que todas las demás leyes deben respetar.'],
['Soberanía','Es el poder de decidir cómo se organiza y gobierna un país.'],
['Democracia','Es un sistema en el que el pueblo participa y elige a sus representantes mediante el voto.'],
['Garantía','Es una medida que ayuda a proteger un derecho.'],
['Institución','Es una organización que cumple una función importante para la sociedad.'],
['Títulos oficiales','Son los nombres de los grandes bloques de la Constitución.'],
['Cortes Generales','Son el Congreso de los Diputados y el Senado, que representan al pueblo español.'],
['Senado','Es la cámara de las Cortes Generales que representa a los territorios.'],
['Tribunal Constitucional','Es el intérprete supremo de la Constitución. Decide cómo se entiende la Constitución cuando hay una cuestión constitucional o si una norma la respeta.\nOjo: no forma parte del Poder Judicial ni es el tribunal superior de todos los jueces.'],
['Sancionar · dos significados','1. El Rey da su aprobación formal a una ley.\n2. Imponer una multa o un castigo.\nCuando el Rey sanciona una ley, usamos el primer significado.'],
['Ratificar','Es confirmar una decisión, como hizo el pueblo al votar la Constitución.'],
['Entrar en vigor','Es empezar a tener efecto y ser de obligado cumplimiento.'],
['Publicar en el BOE','Es dar a conocer una norma en el Boletín Oficial del Estado.']];
const $=id=>document.getElementById(id), key='oporadar_vocabulario_t1_v1';
let saved=new Set(), queue=[], pos=0, errors=[], successes=0, revealed=false, rated=false;
try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))saved=new Set(data.filter(x=>Number.isInteger(x)&&x>=0&&x<cards.length));}catch{}
function persist(){try{localStorage.setItem(key,JSON.stringify([...saved]));}catch{$('notice').textContent='Este navegador no permite guardar el repaso. Puedes continuar esta ronda.';}}
function start(ids){queue=[...ids];for(let i=queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}pos=0;errors=[];successes=0;$('play').hidden=false;$('result').hidden=true;$('progress').max=queue.length;show();}
function show(){revealed=false;rated=false;$('next').hidden=true;$('ratingFeedback').hidden=true;$('card').classList.remove('flipped');$('answer').setAttribute('aria-hidden','true');$('card').querySelector('.front').setAttribute('aria-hidden','false');$('card').setAttribute('aria-label','Dar la vuelta: '+cards[queue[pos]][0]);$('word').textContent=cards[queue[pos]][0];$('answer').textContent=cards[queue[pos]][1];$('fail').disabled=$('doubt').disabled=$('pass').disabled=true;$('status').textContent=`Tarjeta ${pos+1} de ${queue.length} · ${successes} aciertos`;$('progress').value=pos;$('card').focus({preventScroll:true});}
$('card').onclick=()=>{revealed=true;$('card').classList.add('flipped');$('answer').setAttribute('aria-hidden','false');$('card').querySelector('.front').setAttribute('aria-hidden','true');$('card').setAttribute('aria-label',cards[queue[pos]][1]);$('fail').disabled=$('doubt').disabled=$('pass').disabled=false;};
function rate(outcome){if(!revealed||rated)return;rated=true;const id=queue[pos];if(outcome==='acierto'){successes++;saved.delete(id);}else{errors.push(id);saved.add(id);}persist();$('fail').disabled=$('doubt').disabled=$('pass').disabled=true;$('ratingFeedback').textContent=outcome==='acierto'?'Recuperada. Relee la definición antes de avanzar.':outcome==='duda'?'Duda guardada para repasar. Puedes estudiar la definición.':'Fallo guardado para repasar. Puedes estudiar la definición.';$('ratingFeedback').hidden=false;$('next').textContent=pos+1<queue.length?'Siguiente tarjeta →':'Ver resultados →';$('next').hidden=false;$('next').focus();}
function advance(){if(!rated)return;pos++;if(pos<queue.length)show();else{$('play').hidden=true;$('result').hidden=false;$('score').textContent=successes+' aciertos de '+queue.length+'. '+(errors.length?errors.length+' dudas o fallos para volver a practicar.':'¡Has recordado todas las palabras!');$('retry').disabled=!errors.length;$('all').focus();}}
$('fail').onclick=()=>rate('fallo');$('doubt').onclick=()=>rate('duda');$('pass').onclick=()=>rate('acierto');$('next').onclick=advance;$('retry').onclick=()=>start(errors);$('all').onclick=()=>start(cards.map((_,i)=>i));$('saved').onclick=()=>{if(saved.size)start([...saved]);else $('notice').textContent='No tienes fallos guardados.';};try{const ref=new URL(new URLSearchParams(window.location.search).get('volver')||document.referrer);if(ref.protocol==='https:'&&/^\/tema-1\/juegos\/menu-memoria\/(?:index\.html|vocabulario-juridico\.html)?$/.test(ref.pathname)){$('backToMenu').href=ref.href;$('backToMenu').textContent='← Centro de Juegos';}}catch(_){};start(cards.map((_,i)=>i));
</script></html>
