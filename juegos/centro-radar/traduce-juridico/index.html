<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traduce el Jurídico · OpoRadarCádiz</title><link rel="stylesheet" href="style.css"></head><body><main>
<p class="brand">OPORADARCÁDIZ · COMPRENDER</p>
<section id="home"><h1>Traduce el Jurídico</h1><p>Una frase. Una idea.<br>En palabras fáciles.</p><label>Tema<select id="theme"><option value="1">Tema 1 · Constitución</option></select></label><button id="start">Empezar</button><button id="hard" class="secondary">Solo las difíciles</button><p id="availability" role="status"></p><a href="propuesta.html">Revisar las 30 tarjetas propuestas</a></section>
<section id="game" hidden><div class="top"><span id="position"></span><button id="leave" class="plain">Salir</button></div><progress id="progress" value="0" max="30" aria-label="Tarjetas valoradas"></progress>
<button id="card" class="card" aria-label="Girar tarjeta" aria-expanded="false"><span class="face front"><span class="eyebrow">TRADUCE ESTA FRASE</span><span id="question" class="question"></span><span class="hint">Pulsa para ver la explicación</span></span><span class="face back" aria-hidden="true"><span class="eyebrow">EN PALABRAS FÁCILES</span><span id="answer" class="answer"></span><span id="think" class="extra"></span><span id="warning" class="extra"></span></span></button>
<div id="ratings" hidden><button data-rate="acierto">Lo entendí</button><button data-rate="duda" class="secondary">Tengo dudas</button><button data-rate="fallo" class="secondary">No lo entendí</button></div><p id="ratingNote" class="notice" role="status" hidden></p><button id="next" hidden>Siguiente tarjeta →</button></section>
<section id="result" hidden><h1>Rastreo terminado</h1><p id="summary"></p><button id="retry">Repasar las difíciles</button><button id="again" class="secondary">Volver al inicio</button></section>
<p id="notice" class="notice" role="status"></p><a class="backlink" href="../tema-1/?radar=4">Volver al Centro Radar</a></main><script src="../shared/progress.js"></script><script src="cards.js"></script><script src="app.js"></script></body></html>
